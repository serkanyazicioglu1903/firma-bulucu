name: Optional daily encrypted PostgreSQL offsite backup

# IMPORTANT: This workflow does NOTHING until the owner sets the repository
# variable CT_BACKUP_ENABLED=true and both private repository secrets.
# A skipped job is NOT a successful backup. GitHub Actions artifacts expire.
on:
  # PRs get a strictly offline self-test; production backup steps never run on PRs.
  pull_request:
    paths:
      - '.github/workflows/opt-in-encrypted-backup.yml'
      - 'scripts/scheduled_encrypted_backup.py'
      - 'scripts/postgres_encrypted_backup.py'
      - 'tests/test_scheduled_encrypted_backup.py'
  workflow_dispatch:
  schedule:
    # 04:17 Türkiye time (UTC+3, no DST); GitHub schedules can be delayed.
    - cron: '17 1 * * *'

permissions:
  contents: read

concurrency:
  group: ct_app_encrypted_backup
  cancel-in-progress: false

jobs:
  encrypted-ct-app:
    # A PR can validate this file without reading secrets or touching a database.
    # Actual backups still require the existing explicit repository variable.
    if: ${{ github.event_name != 'pull_request' && vars.CT_BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CT_BACKUP_ENABLED: ${{ vars.CT_BACKUP_ENABLED }}
      CT_BACKUP_OUTPUT_DIR: /tmp/asct-encrypted

    steps:
      - name: Checkout trusted main repository code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure backup secrets are present
        shell: bash
        env:
          CT_BACKUP_DATABASE_URL: ${{ secrets.CT_BACKUP_DATABASE_URL }}
          CT_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.CT_BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          if [ -z "$CT_BACKUP_DATABASE_URL" ] || [ -z "$CT_BACKUP_ENCRYPTION_PASSPHRASE" ]; then
            echo 'ERROR: required private backup secrets have not been configured.'
            exit 1
          fi

      - name: Install required PostgreSQL and AES libraries
        run: python -m pip install 'psycopg[binary]>=3.2' 'cryptography>=44.0'

      - name: Export, AES-encrypt and self-verify backup
        env:
          CT_BACKUP_DATABASE_URL: ${{ secrets.CT_BACKUP_DATABASE_URL }}
          CT_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.CT_BACKUP_ENCRYPTION_PASSPHRASE }}
        run: python -m scripts.scheduled_encrypted_backup

      - name: Store encrypted-only offsite snapshot for 7 days
        uses: actions/upload-artifact@v4
        with:
          name: ct_app_encrypted_${{ github.run_id }}_${{ github.run_attempt }}
          path: /tmp/asct-encrypted/*.asct
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Cleanup encrypted artifact on runner
        if: always()
        shell: bash
        run: |
          if [ -d "$CT_BACKUP_OUTPUT_DIR" ]; then
            rm -f "$CT_BACKUP_OUTPUT_DIR"/*.asct
          fi

  offline-backup-safety-smoke:
    # Synthetic test data only; no real DB endpoint and no repository secrets.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proposed workflow and offline tests
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python for synthetic backup tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline backup test dependencies
        run: python -m pip install 'psycopg[binary]>=3.2' 'cryptography>=44.0'
      - name: Assert opt-in, encryption and offline safety using fake ZIP
        run: python -m unittest tests.test_scheduled_encrypted_backup -v
