name: Python app checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: python-app-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure CI security secret
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml <<'EOF'
          CONTROL_TOWER_PASSWORD = "ci-test-password"
          EOF

      - name: Compile Python files
        run: python -m py_compile app.py control_tower.py ai_manager.py preflight_check.py security_admin.py management_reports.py role_portal.py migrate_sqlite_to_postgres.py

      - name: Security and role tests
        run: pytest -q tests/test_core.py tests/test_security_gate_ui.py tests/test_postgres_connection.py

      - name: Offline PostgreSQL staging schema checks
        run: |
          python -m unittest discover -s tests -p 'test_postgres_staging_schema.py' -v
          python scripts/build_pg_schema.py --output /tmp/control_tower_pg_staging.sql
          test -s /tmp/control_tower_pg_staging.sql
          grep -q 'CREATE SCHEMA IF NOT EXISTS "ct_staging"' /tmp/control_tower_pg_staging.sql

      - name: Control Tower preflight
        run: python preflight_check.py --demo

      - name: Legacy review regression tests
        run: python -m unittest discover -s tests -v

      - name: Premium business flow tests
        run: pytest -q tests/test_premium_flows.py

      - name: Search quality tests
        run: pytest -q tests/test_search_quality.py

      - name: Recommendation UI regression test
        run: pytest -q tests/test_streamlit_recommendation_ui.py

      - name: Complete isolated regression suite
        run: python -m pytest -q

      - name: Streamlit startup smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app.py", default_timeout=60)
          app.session_state["ct_user"] = {
              "username": "ci-admin",
              "display_name": "CI Admin",
              "role": "ADMIN",
          }
          app.session_state["ct_session_id"] = "ci-session"
          app.run()

          if app.exception:
              raise AssertionError(f"Streamlit startup exception: {app.exception}")

          print("Streamlit app loaded successfully.")
          print("Top-level tabs:", [t.label for t in app.tabs])
          PY

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and browser test dependencies
        run: |
          pip install -r requirements.txt playwright==1.51.0
          python -m playwright install --with-deps chromium webkit
      - name: Desktop and phone viewport acceptance
        run: python scripts/browser_acceptance.py
      - name: Save screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: browser-artifacts/

  postgres-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ct_test
          POSTGRES_USER: ct_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ct_test -d ct_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AS_CT_TEST_POSTGRES_URL: postgresql://ct_test:ephemeral-ci-only@127.0.0.1:5432/ct_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Real PostgreSQL workflow, concurrency and rollback acceptance
        run: python -m pytest -q tests/test_postgres_workflow_live.py

      - name: Install browser engines for PostgreSQL application acceptance
        run: |
          pip install playwright==1.51.0
          python -m playwright install --with-deps chromium webkit
      - name: PostgreSQL desktop and phone acceptance
        run: python scripts/browser_acceptance.py --postgres-test
      - name: Save PostgreSQL screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-postgres
          path: browser-artifacts-postgres/
