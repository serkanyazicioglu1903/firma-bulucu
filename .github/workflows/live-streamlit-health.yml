name: Live Streamlit health check
on:
  push:
    branches: [main]
    paths:
      - app.py
      - real_quote_workspace.py
      - company_runtime_ui.py
      - scripts/**
      - .github/workflows/live-streamlit-health.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public Streamlit health endpoint
        env:
          APP_URL: https://firma-bulucu-4suzwmdtqv6rtjhha9d3qw.streamlit.app
        run: |
          python - <<'PY'
          import os, time, urllib.request, urllib.error
          url = os.environ["APP_URL"].rstrip("/") + "/_stcore/health"
          last = "not attempted"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"AS-Control-Tower-CI-Health/1.0"}), timeout=15) as response:
                      status = response.status
                      body = response.read(100).decode("utf-8", "replace").strip()
                      if status == 200 and body.lower() in ("ok", "healthy"):
                          print("PASS: public Streamlit health endpoint responded OK")
                          break
                      last = f"HTTP {status}, unexpected health response"
              except (urllib.error.URLError, TimeoutError, OSError) as exc:
                  last = type(exc).__name__
              if attempt < 11:
                  time.sleep(10)
          else:
              raise SystemExit(f"FAIL: public app health not confirmed ({last})")
          PY
      - name: State scope of verification
        run: |
          echo "Public Streamlit process health only."
          echo "Does NOT verify four-company tenancy, login, RLS, DB migrations, quote workflows, or deployment commit."
