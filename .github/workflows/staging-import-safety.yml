name: Offline staging import safety

on:
  pull_request:
    paths:
      - "scripts/staging_import.py"
      - "scripts/backup_sqlite.py"
      - "scripts/build_pg_schema.py"
      - "scripts/backup_report.py"
      - "security_admin.py"
      - "tests/test_staging_import.py"
      - "tests/test_backup_report.py"
      - "scripts/staging_business_pilot.py"
      - "tests/test_staging_business_pilot.py"
      - ".github/workflows/staging-import-safety.yml"
  push:
    branches: [main]
    paths:
      - "scripts/staging_import.py"
      - "scripts/backup_sqlite.py"
      - "scripts/build_pg_schema.py"
      - "scripts/backup_report.py"
      - "security_admin.py"
      - "tests/test_staging_import.py"
      - "tests/test_backup_report.py"
      - "scripts/staging_business_pilot.py"
      - "tests/test_staging_business_pilot.py"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test verified backups (no network credentials)
        run: python -m unittest tests.test_staging_import tests.test_backup_report tests.test_staging_business_pilot -v
